name: CI Pipeline

on:
  push:
    branches: [ "main", "tasks/AGW-0" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile and Test with Coverage
        run: ./gradlew test jacocoTestReport

      - name: SonarQube analysis
        if:  env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar -Dsonar.projectKey=danworldman_api-gateway -Dsonar.organization=danworldman -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=$SONAR_TOKEN

      - name: Assemble Release Artifact
        run: ./gradlew bootJar

      - name: Build Docker image
        run: docker build -t api-gateway:latest .