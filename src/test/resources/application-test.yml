spring:
  cloud:
    gateway:
      routes:
        - id: register-local
          uri: forward:/api/v1/auth/register
          predicates:
            - Path=/api/v1/auth/register

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/users/**

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

server:
  port: 0

resilience4j:
  circuitbreaker:
    instances:
      authCircuitBreaker:
        slidingWindowSize: 2
        minimumNumberOfCalls: 1
        permittedNumberOfCallsInHalfOpenState: 1
        waitDurationInOpenState: 1s
      userCircuitBreaker:
        slidingWindowSize: 2
        minimumNumberOfCalls: 1
        permittedNumberOfCallsInHalfOpenState: 1
        waitDurationInOpenState: 1s

logging:
  level:
    com.innowise.apigateway: DEBUG