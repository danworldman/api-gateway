management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
      
spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 30000
        response-timeout: 30s
      server:
        webflux:
          routes:
            - id: register-local
              uri: forward:/register
              predicates:
                - Path=/register

            - id: user-service
              uri: http://user-app:8080
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userCircuitBreaker
                    fallbackUri: forward:/fallback/user

            - id: user-cards
              uri: http://user-app:8080
              predicates:
                - Path=/api/cards/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userCircuitBreaker
                    fallbackUri: forward:/fallback/user

            - id: auth-service
              uri: http://auth-app:8081
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: authCircuitBreaker
                    fallbackUri: forward:/fallback/auth

            - id: jwks
              uri: http://auth-app:8081
              predicates:
                - Path=/oauth2/jwks
              filters:
                - name: CircuitBreaker
                  args:
                    name: authCircuitBreaker
                    fallbackUri: forward:/fallback/auth

            - id: order-service
              uri: http://order-app:8082
              predicates:
                - Path=/api/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
                    fallbackUri: forward:/fallback/order

            - id: items
              uri: http://order-app:8082
              predicates:
                - Path=/api/items/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
                    fallbackUri: forward:/fallback/order

            - id: payment-service
              uri: http://payment-app:8083
              predicates:
                - Path=/api/payments/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    statuses: INTERNAL_SERVER_ERROR, SERVICE_UNAVAILABLE, BAD_GATEWAY
                    methods: POST
                    exceptions: java.net.ConnectException, java.net.SocketTimeoutException
                - name: CircuitBreaker
                  args:
                    name: paymentCircuitBreaker
                    fallbackUri: forward:/fallback/payment