apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: system-zookeeper
  template:
    metadata:
      labels:
        app: system-zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.4.0
          ports:
            - containerPort: 2181
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 20
            periodSeconds: 5
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: system-zookeeper
spec:
  selector:
    app: system-zookeeper
  ports:
    - port: 2181
      targetPort: 2181
  type: ClusterIP