apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-script
data:
  mock.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import random, json
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/api/numbers":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"number": random.randint(0, 99)}).encode())
            else:
                self.send_response(404)
                self.end_headers()
    HTTPServer(("0.0.0.0", 8084), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-mock
  template:
    metadata:
      labels:
        app: external-mock
    spec:
      containers:
        - name: external-mock
          image: python:3.11-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/mock.py"]
          ports:
            - containerPort: 8084
          volumeMounts:
            - name: mock-script-volume
              mountPath: /mock.py
              subPath: mock.py
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /api/numbers
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/numbers
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: mock-script-volume
          configMap:
            name: mock-script
---
apiVersion: v1
kind: Service
metadata:
  name: external-mock
spec:
  selector:
    app: external-mock
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP