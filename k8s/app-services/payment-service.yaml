apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-app
  template:
    metadata:
      labels:
        app: payment-app
    spec:
      containers:
        - name: payment-service
          image: payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 5
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m"
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: MONGOCK_ENABLED
              value: "false"
            - name: SPRING_MONGODB_URI
              value: "mongodb://system-mongodb:27017/payment_db?connectTimeoutMS=5000&socketTimeoutMS=5000"
            - name: EXTERNAL_API_URL
              value: "http://external-mock:8084/api/numbers"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://auth-app:8081/oauth2/jwks"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "system-kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-app
spec:
  selector:
    app: payment-app
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP