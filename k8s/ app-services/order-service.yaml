apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-app
  template:
    metadata:
      labels:
        app: order-app
    spec:
      containers:
      - name: order-service
        image: order-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://system-db:5432/order_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: postgres-password
        - name: USER_SERVICE_URL
          value: "http://user-app:8080"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "system-kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: order-app
spec:
  selector:
    app: order-app
  ports:
  - port: 8082
    targetPort: 8082
  type: ClusterIP
